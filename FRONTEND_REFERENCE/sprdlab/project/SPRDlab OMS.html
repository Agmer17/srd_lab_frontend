<!-- App shell + router -->
<script type="text/babel">
const { useState } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "loggedIn": false,
  "page": "home",
  "heroHeadline": "Design that ships.\nVideo that sells.",
  "showStats": true
}/*EDITMODE-END*/;

/* ── Placeholder for unbuilt protected screens ── */
function PlaceholderPage({ page, onNavigate }) {
  const ICONS = { orders:'ri-file-list-line', payments:'ri-bank-card-line', projects:'ri-folder-line', chat:'ri-message-2-line', profile:'ri-user-line', users:'ri-shield-user-line', analytics:'ri-bar-chart-line', auth:'ri-lock-line' };
  return (
    <div>
      <header className="sprd-header">
        <span className="sprd-crumb" style={{ textTransform:'capitalize' }}>{page}</span>
      </header>
      <div style={{ maxWidth:480, margin:'0 auto', padding:'80px 28px', textAlign:'center' }}>
        <div style={{ width:56, height:56, borderRadius:14, background:'oklch(0.85 0.005 250)', display:'flex', alignItems:'center', justifyContent:'center', margin:'0 auto 16px', fontSize:24, color:'var(--muted-foreground)' }}>
          <i className={ICONS[page] || 'ri-construction-line'}></i>
        </div>
        <h2 style={{ fontSize:18, fontWeight:600, margin:'0 0 6px', letterSpacing:'-0.02em' }}>This screen is in progress</h2>
        <p style={{ fontSize:13, color:'var(--muted-foreground)', margin:'0 0 20px', lineHeight:1.6 }}>
          This is part of the protected app flow and will be built in a future iteration.
        </p>
        <button className="sprd-btn sprd-btn--outline sprd-btn--sm" onClick={() => onNavigate('home')}>
          <i className="ri-arrow-left-line"></i> Back to home
        </button>
      </div>
    </div>
  );
}

/* ── Root App ── */
function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // Page nav can come from sidebar clicks OR the tweaks select
  const [navPage, setNavPage] = useState(TWEAK_DEFAULTS.page);
  const page = navPage;

  function handleNavigate(p) {
    setNavPage(p);
    setTweak('page', p);
  }

  // Sync tweaks → nav when tweaks panel changes the page select
  const tweakPage = tweaks.page;
  React.useEffect(() => { setNavPage(tweakPage); }, [tweakPage]);

  const user = tweaks.loggedIn ? DEMO_USER : null;
  const BUILT_PAGES = ['home', 'products', 'review', 'payment', 'payments'];
  return (
    <div className="sprd-app">
      <AppSidebar currentPage={page} onNavigate={handleNavigate} user={user} />
      <div className="sprd-main">
        {page === 'home'     && <HomePage            onNavigate={handleNavigate} tweaks={tweaks} />}
        {page === 'products' && <ProductsPage        onNavigate={handleNavigate} />}
        {page === 'review'   && <ReviewPage          context={MOCK_COMPLETED_ORDER} onNavigate={handleNavigate} />}
        {page === 'payment'  && <PaymentPage         context={MOCK_PENDING_ORDER}   onNavigate={handleNavigate} />}
        {page === 'payments' && <PaymentHistoryPage  onNavigate={handleNavigate} />}
        {!BUILT_PAGES.includes(page) && <PlaceholderPage page={page} onNavigate={handleNavigate} />}
      </div>

      <TweaksPanel>
        <TweakSection title="View">
          <TweakToggle
            label="Signed-in user"
            value={tweaks.loggedIn}
            onChange={v => setTweak('loggedIn', v)}
          />
          <TweakSelect
            label="Active page"
            value={tweaks.page}
            options={['home', 'products', 'payment', 'payments', 'review', 'orders', 'projects', 'chat']}
            onChange={v => setTweak('page', v)}
          />
        </TweakSection>
        <TweakSection title="Homepage">
          <TweakToggle
            label="Show stats panel"
            value={tweaks.showStats}
            onChange={v => setTweak('showStats', v)}
          />
          <TweakText
            label="Hero headline"
            value={tweaks.heroHeadline}
            onChange={v => setTweak('heroHeadline', v)}
          />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
